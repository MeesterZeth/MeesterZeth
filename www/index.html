<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1b2a">
  <title>Eilandrijk</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hoofdmenu -->
  <section id="screen-menu" class="screen active">
    <canvas id="menu-bg" aria-hidden="true"></canvas>
    <div class="menu-shade"></div>
    <button class="lang-btn" id="btn-lang" aria-label="Language"></button>
    <div class="menu-wrap">
      <img src="icon.svg" alt="" class="logo">
      <h1 class="title">Eilandrijk</h1>
      <p class="tagline" data-i18n="menu.tagline"></p>
      <button class="btn green big play" id="btn-continue" hidden><span data-i18n="menu.continue"></span><small id="continue-sub"></small></button>
      <button class="btn primary big play" id="btn-play"><span data-i18n="menu.play"></span><small id="play-sub"></small></button>
      <div class="row">
        <button class="btn big" id="btn-levels" data-i18n="menu.levels"></button>
        <button class="btn big gold" id="btn-shop" data-i18n="menu.shop"></button>
      </div>
      <div class="row">
        <button class="btn" id="btn-tutorial" data-i18n="menu.tutorial"></button>
        <button class="btn" id="btn-help" data-i18n="menu.help"></button>
        <button class="btn" id="btn-settings" data-i18n="menu.settings"></button>
      </div>
      <p class="menu-stars" id="menu-stars"></p>
    </div>
  </section>

  <!-- Levelkeuze -->
  <section id="screen-levels" class="screen">
    <header class="bar">
      <button class="btn icon" data-back aria-label="Terug">‹</button>
      <h2 data-i18n="levels.title"></h2>
      <span id="levels-stars" class="pill"></span>
    </header>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- Spel -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <div class="hud-top">
        <button class="btn icon" id="btn-pause" aria-label="Pauze"><span class="pause-icon"></span></button>
        <div class="chip"><i class="coin"></i><b id="hud-gold">0</b><small id="hud-net"></small></div>
        <div class="chip turn-chip"><small data-i18n="hud.turn"></small><b id="hud-turn">1</b></div>
        <button class="btn icon" id="btn-sound" aria-label="Geluid"></button>
      </div>
      <div class="clocks">
        <div class="clock" id="clock-me">
          <span class="dot" id="clock-me-dot"></span><span class="who" data-i18n="hud.you"></span>
          <b id="clock-me-time">1:00</b>
          <span class="clock-bar"><span id="clock-me-bar"></span></span>
        </div>
        <div class="clock" id="clock-opp">
          <span class="dot" id="clock-opp-dot"></span><span class="who" id="clock-opp-name">Tegenstander</span>
          <b id="clock-opp-time">0:00</b>
        </div>
      </div>
      <button class="standings" id="btn-standings">
        <span class="share" id="share-bar"></span>
        <span class="standings-label" id="standings-label"></span>
      </button>
    </header>
    <div class="board">
      <canvas id="board"></canvas>
      <div id="toast" class="toast"></div>
      <div id="banner" class="banner"><span id="banner-text"></span></div>
      <div class="zoom">
        <button class="btn icon" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="btn icon" id="zoom-out" aria-label="Zoom out">−</button>
        <button class="btn icon" id="btn-defense" aria-label="Defense map"><span class="shield-icon"></span></button>
      </div>
      <div class="coach" id="coach" hidden>
        <div class="coach-text" id="coach-text"></div>
        <div class="coach-foot"><small id="coach-step"></small>
          <button class="btn" id="coach-skip" data-i18n="common.skip"></button>
          <button class="btn gold" id="coach-next" data-i18n="common.next"></button></div>
      </div>
    </div>
    <footer class="panel">
      <div id="panel-info" class="panel-info"></div>
      <div id="panel-actions" class="panel-actions"></div>
      <div class="end-row">
        <button class="btn icon undo" id="btn-undo" aria-label="Undo">↶</button>
        <button class="btn primary end" id="btn-end"></button>
      </div>
    </footer>
  </section>

  <!-- Venster (wordt gevuld door de code) -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
