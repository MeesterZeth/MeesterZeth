<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15171B">
<meta name="format-detection" content="telephone=no">
<title>Fadeproof</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* basis: veilige randen van de iPhone (notch, home-balk) en app-gevoel */
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;overscroll-behavior-y:none}
img{max-width:100%}
button,a,.topic,.legend button,nav.tabs a{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
</style>
<style>
/* Layout: a live cartoon "world" canvas (cars on the road or a rich-life harbour) as hero, then today's tasks, courses, week plan, profile and Pro. Two skins, each a deliberate single look: Cars (dusk road) and Princess (pastel castle). */
:root{
  color-scheme:dark;
  --bg:#15171B; --surface:#1E2127; --surface2:#272B33; --line:#353A44; --text:#F1F2F4; --muted:#A2A8B4;
  --accent:#FF5A1F; --on-accent:#17120E; --accent2:#FFD23F; --good:#3DDC84; --bad:#FF5C5C; --soft:rgba(255,90,31,.12);
  --c0:#FF5A1F; --c1:#3EA6FF; --c2:#FFD23F; --c3:#3DDC84; --c4:#C77DFF;
  --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --dstyle:italic; --dweight:800; --dcase:uppercase;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --word:"Barlow", system-ui, sans-serif; --wstyle:normal; --wweight:600;
  --radius:10px;
}
:root[data-skin="rich"]{
  color-scheme:light;
  --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#E9ECF0; --line:#D9DEE5; --text:#0D1B2A; --muted:#5B6878;
  --accent:#12263F; --on-accent:#FFFFFF; --accent2:#A87B22; --good:#1E7A55; --bad:#C0392B; --soft:rgba(18,38,63,.06);
  --c0:#B8892E; --c1:#1F6FB2; --c2:#C0392B; --c3:#1E8C7A; --c4:#6B4BA6;
  --display:"Playfair Display", Georgia, "Times New Roman", serif; --dstyle:normal; --dweight:700; --dcase:none;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --word:"Playfair Display", Georgia, serif; --wstyle:normal; --wweight:700;
  --radius:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.5}
.wrap{max-width:1160px; margin:0 auto; padding-block:16px 64px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.05; font-family:var(--display); font-style:var(--dstyle); font-weight:var(--dweight); text-transform:var(--dcase)}
h2{font-size:clamp(1.6rem,3.4vw,2.2rem); letter-spacing:.005em}
h3{font-size:1.3rem}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.num{font-variant-numeric:tabular-nums; font-weight:700}

/* top */
.top{display:flex; flex-wrap:wrap; gap:14px 24px; justify-content:space-between; align-items:center}
.logo{font-family:var(--display); font-style:var(--dstyle); font-weight:var(--dweight); text-transform:var(--dcase); font-size:clamp(2.3rem,6.5vw,3.4rem); line-height:1}
.logo span{display:inline-block}
.tagline{margin:4px 0 0; color:var(--muted); font-size:1.02rem}
.me{display:flex; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px 10px 10px; min-width:0; flex:0 1 440px}
.avatar{width:54px; height:54px; border-radius:50%; display:grid; place-items:center; flex:none; font-family:var(--display); font-style:var(--dstyle); font-weight:var(--dweight); font-size:1.5rem; color:#fff; text-transform:uppercase}
.me .who{min-width:0; flex:1}
.me .nm{font-weight:700; font-size:1.05rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.me .tl{font-size:.85rem; color:var(--accent)}
.xpbar{height:8px; border-radius:5px; background:var(--surface2); overflow:hidden; margin-top:6px}
.xpbar span{display:block; height:100%; background:var(--accent); transition:width .6s}
.res{display:flex; gap:12px; margin-top:4px; font-size:.82rem; color:var(--muted); flex-wrap:wrap}
.res b{color:var(--text)}
.tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; margin-top:10px}
.seg{display:flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface)}
.seg button{border:none; background:none; padding:3px 11px; border-radius:999px; font-weight:700; font-size:.82rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}

nav.tabs{display:flex; gap:2px; flex-wrap:wrap; margin:16px 0 18px; border-bottom:1px solid var(--line)}
nav.tabs a{padding:10px 14px; text-decoration:none; color:var(--muted); font-weight:700; border-bottom:2.5px solid transparent; margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--text); border-color:var(--accent)}
nav.tabs a.pro{color:var(--accent)}

.view{display:grid; gap:20px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; min-width:0}
.head{display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:space-between; align-items:baseline; margin-bottom:12px}
.btn{border:1.5px solid var(--accent); background:var(--accent); color:var(--on-accent); border-radius:999px; padding:7px 16px; font-weight:700; white-space:nowrap}
.btn.line{background:transparent; color:var(--accent)}
.btn.ghost{background:transparent; border-color:var(--line); color:var(--text)}
.btn.danger{background:transparent; border-color:var(--bad); color:var(--bad)}
.btn.danger.armed{background:var(--bad); color:#fff}
.btn.sm{padding:4px 12px; font-size:.88rem}
.btn:disabled{opacity:.4; cursor:not-allowed}
.link{background:none; border:none; padding:0; color:var(--accent); font-weight:700; text-decoration:underline; text-underline-offset:3px}
input[type=text],input[type=date],select,textarea{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-width:0; width:100%}
textarea{resize:vertical}
.grid2{display:grid; grid-template-columns:1.2fr 1fr; gap:20px; align-items:start}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}
.empty{color:var(--muted); font-style:italic; padding:6px 0}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; flex:none}
.reward{font-size:.8rem; color:var(--accent2); font-weight:700; white-space:nowrap}

/* world */
.world{position:relative; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:var(--surface)}
.world canvas{display:block; width:100%}
.world .cap{position:absolute; left:16px; top:12px; max-width:62%}
.world .cap h2{font-size:clamp(1.4rem,3vw,1.9rem)}
.world .cap p{margin:2px 0 0; font-size:.88rem; color:var(--muted)}
.world .cap h2, .world .avg b{color:#F7EBDD; text-shadow:0 1px 10px rgba(0,0,0,.6)}
.world .cap p, .world .avg{color:rgba(247,235,221,.8); text-shadow:0 1px 8px rgba(0,0,0,.6)}
.avg{position:absolute; right:16px; top:14px; text-align:right; font-size:.78rem; color:var(--muted)}
.avg .nw{display:block; margin-top:8px}
.avg .nw b{font-size:1.4rem}
.avg b{display:block; font-family:var(--display); font-style:var(--dstyle); font-weight:var(--dweight); font-size:1.8rem; color:var(--text); line-height:1}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; padding:10px 16px; border-top:1px solid var(--line); background:var(--surface)}
.legend button{background:none; border:none; padding:2px 0; text-align:left; display:flex; align-items:center; gap:0; font-size:.88rem; min-width:0}
.legend button b{font-weight:700; margin-right:6px}
.legend button:hover b{text-decoration:underline}
@media (max-width:560px){.world .cap p{display:none}}

/* tasks */
.task{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--line)}
.task:first-of-type{border-top:none}
.ticon{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; border:2px solid; font-weight:800}
.task .t{font-weight:700; min-width:0; overflow-wrap:anywhere}
.task .m{font-size:.82rem; color:var(--muted)}
.task.done{opacity:.5}
.task.done .t{text-decoration:line-through}
.bonus{display:flex; gap:12px; align-items:center; margin-top:12px; padding:10px 12px; border:1px dashed var(--accent); border-radius:12px; background:var(--soft); font-size:.9rem; flex-wrap:wrap}
.bonus .bar{flex:1; height:6px; border-radius:4px; background:var(--surface2); overflow:hidden; min-width:60px}
.bonus .bar span{display:block; height:100%; background:var(--accent)}

.topics{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:10px}
.topic{background:none; border:none; padding:2px 0; text-align:left; display:inline-flex; flex-direction:column}
.topic .w{font-family:var(--word); font-weight:var(--wweight); font-size:1.2rem; line-height:1.2; transition:opacity .6s}
.topic .w.new{text-decoration:underline dashed; text-underline-offset:5px; text-decoration-thickness:1px}
.topic .r{font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums}
.topic:hover .w{opacity:1!important}
.lowrow{display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.lowrow:first-of-type{border-top:none}
.lowrow .w{font-family:var(--word); font-weight:var(--wweight); font-size:1.15rem; line-height:1.2}
.meter{height:6px; border-radius:3px; background:var(--surface2); overflow:hidden; margin-top:4px; max-width:220px}
.meter span{display:block; height:100%}
.pct{font-variant-numeric:tabular-nums; font-weight:700; font-size:.9rem}

/* courses */
.course{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:22px}
@media (max-width:780px){.course{grid-template-columns:1fr}}
.tag{font-family:var(--body); font-style:normal; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin-left:8px; vertical-align:middle}
.fcbox{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--bg)}
.fcbox .big{font-family:var(--display); font-style:var(--dstyle); font-weight:var(--dweight); font-size:2.6rem; line-height:1}
.gbar{position:relative; height:12px; border-radius:6px; background:var(--surface2); margin:10px 0 4px}
.gbar span{display:block; height:100%; border-radius:6px}
.gbar i{position:absolute; top:-4px; bottom:-4px; left:70%; width:2px; background:var(--text)}
.curve{width:100%; height:auto; display:block; margin-top:8px}
.form{display:grid; grid-template-columns:2fr 1fr; gap:10px; align-items:end}
@media (max-width:600px){.form{grid-template-columns:1fr}}
.field{display:grid; gap:4px; min-width:0}
.notice{border:1px dashed var(--accent); border-radius:12px; padding:12px 14px; background:var(--soft)}

/* week */
.week{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px}
@media (max-width:1000px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.week{grid-template-columns:1fr}}
.day{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:8px; min-width:0}
.day.today{border-color:var(--accent)}
.day .dn{font-weight:700}
.day select{padding:3px 6px; width:auto; font-size:.82rem}
.chipb{border-radius:8px; padding:7px 9px; font-size:.84rem; line-height:1.3; border-left:3px solid; background:var(--bg); overflow-wrap:anywhere}
.chipb.done{opacity:.45; text-decoration:line-through}
.chipb small{display:block; color:var(--muted); font-size:.72rem}
.load{font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums}
.log div{display:grid; grid-template-columns:auto 1fr auto; gap:10px; padding:8px 0; border-top:1px solid var(--line); align-items:baseline}
.log div:first-child{border-top:none}

/* profile */
.skins{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.skin{text-align:left; border:2px solid var(--line); background:var(--bg); border-radius:14px; padding:0; overflow:hidden; display:grid}
.skin[aria-pressed="true"]{border-color:var(--accent)}
.skin .pv{height:74px; position:relative}
.skin .tx{padding:10px 12px; display:grid; gap:2px}
.skin b{font-size:1.05rem}
.skin span{font-size:.84rem; color:var(--muted)}
.shop{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px}
.item{border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; gap:6px; background:var(--bg)}
.item b{font-weight:700}
.swatch{height:26px; border-radius:8px}
.feats{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
.feat{border:1px dashed var(--line); border-radius:12px; padding:12px; color:var(--muted); display:grid; gap:2px}
.feat.on{border-style:solid; border-color:var(--accent); color:var(--text); background:var(--soft)}
.feat b{font-weight:700}
.feat small{color:var(--accent2); font-weight:700}

.avatar svg{width:100%; height:100%; display:block}
.avs{display:flex; gap:10px; flex-wrap:wrap}
.avopt{display:grid; justify-items:center; gap:4px; background:var(--bg); border:2px solid var(--line); border-radius:12px; padding:8px 12px; font-size:.82rem; font-weight:600}
.avopt[aria-pressed="true"]{border-color:var(--accent)}

/* pro */
.plans{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media (max-width:720px){.plans{grid-template-columns:1fr}}
.plan{border:1px solid var(--line); border-radius:var(--radius); padding:22px; background:var(--surface); display:flex; flex-direction:column; gap:12px}
.plan.pro{border:2px solid var(--accent)}
.price{font-family:var(--display); font-style:var(--dstyle); font-weight:var(--dweight); font-size:3rem; line-height:1}
.plan ul{margin:0; padding-left:1.1em; display:grid; gap:6px}
.science{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
@media (max-width:760px){.science{grid-template-columns:1fr}}
.science p{margin:6px 0 0; color:var(--muted); font-size:.94rem}

/* overlays */
.overlay{position:fixed; inset:0; z-index:30; background:rgba(10,12,14,.6); display:flex; align-items:flex-end; justify-content:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) 0 max(12px, env(safe-area-inset-left,0px))}
.overlay.center{align-items:center; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface); border:1px solid var(--line); border-bottom:none; width:100%; max-width:680px; max-height:100%; overflow:auto; border-radius:20px 20px 0 0;
  padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px)); animation:up .28s ease-out; display:grid; gap:14px}
.overlay.center .sheet, .sheet.float{border-radius:20px; border-bottom:1px solid var(--line); padding-bottom:22px}
.sheet.float{margin-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(30px); opacity:.5}to{transform:none; opacity:1}}
.rc-word{font-family:var(--word); font-weight:var(--wweight); font-size:clamp(2rem,7vw,2.8rem); line-height:1.05; transition:opacity 1s, color 1s}
.rc-word.lit{opacity:1!important; color:var(--accent)}
.prompt{font-size:1.1rem; font-weight:700}
.rates{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:540px){.rates{grid-template-columns:1fr}}
.rate{text-align:left; border:1.5px solid var(--line); background:var(--bg); border-radius:12px; padding:12px; display:grid; gap:2px}
.rate b{font-size:1.05rem}
.rate span{font-size:.82rem; color:var(--muted)}
.rate.r0:hover{border-color:var(--bad)} .rate.r1:hover{border-color:var(--accent2)} .rate.r2:hover{border-color:var(--good)}
.loot{display:flex; gap:10px; flex-wrap:wrap}
.loot span{border:1.5px solid var(--accent); color:var(--accent); border-radius:999px; padding:4px 12px; font-weight:700; animation:pop .5s ease-out both}
.loot span:nth-child(2){animation-delay:.12s} .loot span:nth-child(3){animation-delay:.24s}
@keyframes pop{from{transform:scale(.6); opacity:0}to{transform:none; opacity:1}}
.lvlup{text-align:center; justify-items:center}
.lvlup .n{font-family:var(--display); font-style:var(--dstyle); font-weight:var(--dweight); font-size:4.5rem; line-height:1; color:var(--accent)}
.demo{display:flex; flex-wrap:wrap; gap:6px 20px; align-items:baseline; padding:14px 16px; background:var(--bg); border-radius:12px; border:1px solid var(--line)}
.demo .w{font-family:var(--word); font-weight:var(--wweight); font-size:1.5rem; line-height:1.2}
.demo .r{display:block; font-size:.74rem; color:var(--muted)}
.demo .live{animation:fade 4.5s ease-in-out infinite alternate}
@keyframes fade{0%,15%{opacity:1}85%,100%{opacity:.12}}
.tut-focus{outline:2.5px solid var(--accent); outline-offset:3px; border-radius:8px}
.dots{display:flex; gap:6px}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--line)}
.dots i.on{background:var(--accent)}
.foot{display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center}
.toast{position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top,0px)); transform:translate(-50%,-16px); opacity:0; z-index:50;
  background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:700; transition:.25s; pointer-events:none; max-width:calc(100% - 32px); text-align:center}
.toast.show{opacity:1; transform:translate(-50%,0)}
/* ---------- polish ---------- */
:root{--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 36px -20px rgba(0,0,0,.75);--glowc:rgba(255,90,31,.55);
  --bgimg:radial-gradient(900px 420px at 88% -12%,rgba(255,90,31,.12),transparent 62%),radial-gradient(760px 420px at -5% 0%,rgba(62,166,255,.08),transparent 60%)}
:root[data-skin="rich"]{--shadow:0 1px 2px rgba(13,27,42,.05),0 18px 38px -22px rgba(13,27,42,.35);--glowc:rgba(18,38,63,.35);
  --bgimg:radial-gradient(900px 460px at 92% -12%,rgba(242,166,90,.18),transparent 62%),radial-gradient(760px 440px at -5% 0%,rgba(31,111,178,.10),transparent 60%)}
body{background-color:var(--bg);background-image:var(--bgimg);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.panel,.me,.day,.plan,.fcbox{box-shadow:var(--shadow)}
.panel{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 94%,#fff),var(--surface))}
.world{border-radius:22px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 60%,transparent)}
.me{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;
  background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);
  width:fit-content;max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{border:none;margin:0;border-radius:999px;padding:8px 16px;white-space:nowrap;transition:background .2s,color .2s}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px -8px var(--glowc)}
nav.tabs a:hover:not([aria-current]){background:var(--soft);color:var(--text)}
.btn{transition:transform .12s ease,box-shadow .2s,filter .2s,background .2s}
.btn:not(.line):not(.ghost):not(.danger){background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));box-shadow:0 8px 18px -10px var(--glowc)}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97)}
.btn.line:hover:not(:disabled),.btn.ghost:hover:not(:disabled){background:var(--soft)}
.xpbar span,.bonus .bar span{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));position:relative;overflow:hidden}
.xpbar span::after,.bonus .bar span::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.5) 50%,transparent 80%);transform:translateX(-100%);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.task{padding:11px 10px;margin:0 -10px;border-radius:12px;transition:background .2s}
.task:hover{background:var(--soft)}
.ticon{background:color-mix(in srgb,currentColor 12%,transparent);border-width:1.5px}
.legend{gap:8px;padding:12px 14px}
.legend button{padding:5px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);transition:border-color .2s,transform .15s}
.legend button:hover{border-color:var(--accent);transform:translateY(-1px)}
.legend button:hover b{text-decoration:none}
@media (max-width:560px){nav.tabs a{padding:8px 12px} .legend button{width:100%; border-radius:12px; flex-wrap:wrap; row-gap:2px}}
.view:not([hidden]){animation:viewin .35s ease-out}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.overlay{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{box-shadow:0 -24px 60px -24px rgba(0,0,0,.55)}
.toast{box-shadow:0 14px 34px -12px rgba(0,0,0,.5)}
.rate,.item,.skin,.avopt,.feat,.day,.lowrow{transition:transform .15s,border-color .2s,box-shadow .2s,background .2s}
.rate:hover,.item:hover,.skin:hover,.avopt:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.day:hover{transform:translateY(-2px)}
.logo{letter-spacing:-.01em}
input[type=text],input[type=date],select,textarea{transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
/* ---------- full-screen world ---------- */
#cv{position:fixed; inset:0; width:100%; height:100vh; height:100lvh; z-index:0; display:block; pointer-events:none}
.wrap{position:relative; z-index:1}
.world{background:transparent!important; border:none!important; box-shadow:none!important; border-radius:0!important; overflow:visible;
  min-height:280px; display:flex; flex-direction:column; justify-content:flex-end}
.legend{border-top:none; background:transparent; padding:12px 0 0}
.legend button{background:color-mix(in srgb,var(--surface) 80%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.panel,.day,.plan,.me{background:color-mix(in srgb,var(--surface) 80%,transparent)!important; backdrop-filter:blur(12px) saturate(1.15); -webkit-backdrop-filter:blur(12px) saturate(1.15)}
.fcbox,.item,.feat,.skin,.avopt,.rate{background:color-mix(in srgb,var(--bg) 70%,transparent)}
.feat.on{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tagline{text-shadow:0 1px 12px var(--bg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const startOf=s=>new Date(s+"T00:00:00").getTime();
const todayISO=()=>iso(Date.now());
const daysBetween=(a,b)=>Math.round((startOf(b)-startOf(a))/DAY);
// Opslag: in de app via iOS-voorkeuren (blijft bewaard), in de browser via localStorage.
const MEM={};
async function nativeLoad(){
  if(!IS_APP||!NP().Preferences)return;
  for(const k of [KEY,KEY+"-lang",KEY+"-tut"]){try{const r=await NP().Preferences.get({key:k});if(r&&r.value!=null)MEM[k]=r.value}catch(e){}}
}
function store(k,v){MEM[k]=v;try{localStorage.setItem(k,v)}catch(e){}if(IS_APP&&NP().Preferences)NP().Preferences.set({key:k,value:v}).catch(()=>{})}
function read(k){if(k in MEM)return MEM[k];try{return localStorage.getItem(k)}catch(e){return null}}
function haptic(strong){const H=IS_APP&&NP().Haptics;if(H)H.impact({style:strong?"MEDIUM":"LIGHT"}).catch(()=>{});else if(navigator.vibrate)navigator.vibrate(strong?25:10)}
const pct=r=>Math.round(r*100)+"%";
const colVar=i=>`var(--c${i%COLS})`;
const fmtDay=(d,opt)=>new Intl.DateTimeFormat(LANG==="nl"?"nl-NL":"en-GB",opt).format(new Date(d+"T12:00:00"));
const daysTxt=n=>n===1?t("day1"):t("dayN",{n});
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ======================= state ======================= */

  const mk=(name,last,s)=>({id:uid(),name,last:last==null?null:ago(last),S:s||1,n:last==null?0:2});
  return {skin:"race",name:"",color:"orange",owned:["orange"],xp:0,coins:0,saves:0,frozen:[],feats:[],history:[],bonus:"",
    stats:{recalls:0,rescues:0,trials:0,bounties:0},hours:[2,2,2,2,1.5,0,1],plan:null,log:{},
    courses:[
      {id:uid(),ex:true,col:0,name:en?"Microeconomics":"Micro-economie",exam:plus(18),topics:[
        mk(en?"Supply and demand":"Vraag en aanbod",1,9),mk(en?"Price elasticity":"Prijselasticiteit",4,3),mk(en?"Consumer surplus":"Consumentensurplus",6,2),
        mk(en?"Market failure":"Marktfalen",2,6),mk(en?"Game theory":"Speltheorie",null),mk(en?"Monopoly pricing":"Monopolieprijzen",9,3)]},
      {id:uid(),ex:true,col:1,name:en?"Cognitive Psychology":"Cognitieve psychologie",exam:plus(32),topics:[
        mk(en?"Working memory":"Werkgeheugen",3,8),mk(en?"Encoding and retrieval":"Encoderen en ophalen",5,2),mk(en?"Models of attention":"Aandachtsmodellen",null),
        mk(en?"Heuristics and biases":"Heuristieken en biases",1,4),mk(en?"Language acquisition":"Taalverwerving",12,4)]},
      {id:uid(),ex:true,col:2,name:en?"Statistics I":"Statistiek I",exam:plus(9),topics:[
        mk(en?"Hypothesis testing":"Hypothesetoetsen",2,5),mk(en?"Confidence intervals":"Betrouwbaarheidsintervallen",1,12),mk(en?"Regression":"Regressie",7,3),mk("t-test",3,4)]}
    ]};
}
function save(){store(KEY,JSON.stringify(S))}
function boot(){
  LANG=read(KEY+"-lang")||read("fadeproof-v2-lang")||read("fadeproof-v1-lang")||((navigator.language||"en").toLowerCase().startsWith("nl")?"nl":"en");
  try{S=JSON.parse(read(KEY)||"null")}catch(e){S=null}
  if(!S){
    S=seed(LANG);
    try{const o=JSON.parse(read("fadeproof-v2")||"null");
      if(o&&o.courses){S.courses=o.courses;S.hours=o.hours||S.hours;S.log=o.log||{};S.xp=o.xp||0;S.coins=o.ink||0;S.saves=o.wards||0;S.frozen=o.frozen||[];
        S.feats=o.feats||[];S.history=o.history||[];S.stats=Object.assign(S.stats,o.stats||{});S.name=(o.hero&&o.hero.name)||""}
      else{const o1=JSON.parse(read("fadeproof-v1")||"null");if(o1&&o1.courses){S.courses=o1.courses;S.hours=o1.hours||S.hours;S.log=o1.log||{}}}}catch(e){}
  }
  if(S.skin!=="race"&&S.skin!=="rich")S.skin="rich";if(!S.av)S.av="letter";if(["princess","tiara","sneaker"].includes(S.av))S.av="watch";if(["prince","gem","hoodie"].includes(S.av))S.av="yacht";
  useSaves();
  if(!S.plan||S.plan.start!==todayISO())plan(false);
}
function applySkin(){
  document.documentElement.dataset.skin=S.skin;
  const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=S.skin==="race"?"#15171B":"#F3F4F6";
  if(IS_APP&&NP().StatusBar)NP().StatusBar.setStyle({style:S.skin==="race"?"DARK":"LIGHT"}).catch(()=>{});
}

/* ======================= memory model ======================= */
// retention R = e^(-t/S): t = days since last review, S = stability in days
function R(tp,at=Date.now()){if(!tp.last)return 0;return Math.exp(-Math.max(0,at-tp.last)/DAY/tp.S)}
function stat(tp){if(!tp.last)return "sNew";const r=R(tp);return r>=.8?"sGood":r>=.5?"sMid":"sLow"}
const nextReview=x=>Math.max(1,Math.round(-x*Math.log(.7)));
function applyRating(tp,q,at=Date.now()){
  const r0=R(tp,at);
  if(q===0)tp.S=1;else if(q===1)tp.S=Math.max(1.5,tp.S*1.3);else tp.S=Math.max(3,tp.S*(1.8+(1-r0)*1.5));
  tp.last=at;tp.n=(tp.n||0)+1;
}
function avgR(c,at=Date.now()){return c.topics.length?c.topics.reduce((s,tp)=>s+R(tp,at),0)/c.topics.length:0}
const forecast=c=>avgR(c,startOf(c.exam)+9*3600e3);
const allTopics=()=>S.courses.flatMap(c=>c.topics.map(tp=>({c,tp})));
function findTopic(id){for(const c of S.courses){const tp=c.topics.find(x=>x.id===id);if(tp)return{c,tp}}return null}
function urgency(c,tp,at){const dte=Math.max(1,(startOf(c.exam)-at)/DAY);return (tp.last?(1-R(tp,at)):1.1)*(1+10/dte)}

/* ======================= planner ======================= */
function plan(keepDone=true){
  const today=todayISO();
  const kept=(keepDone&&S.plan&&S.plan.start===today)?S.plan.blocks.filter(b=>b.done&&b.day===today):[];
  const sim=new Map();allTopics().forEach(({tp})=>sim.set(tp.id,{last:tp.last,S:tp.S}));
  const blocks=[...kept];
  for(let d=0;d<7;d++){
    const day=iso(Date.now()+d*DAY),dow=(new Date(day+"T12:00:00").getDay()+6)%7;
    let budget=Math.round((S.hours[dow]||0)*60)-blocks.filter(b=>b.day===day).reduce((s,b)=>s+b.mins,0);
    const at=startOf(day)+18*3600e3;
    for(const c of S.courses){if(daysBetween(day,c.exam)===1&&budget>=MOCK*.66&&!blocks.some(b=>b.kind==="mock"&&b.cid===c.id)){const m=Math.min(MOCK,budget);blocks.push({id:uid(),day,kind:"mock",cid:c.id,mins:m,done:false});budget-=m}}
    const cands=[];
    for(const c of S.courses){if(startOf(c.exam)<startOf(day))continue;
      for(const tp of c.topics){const s=sim.get(tp.id);const v={last:s.last,S:s.S};
        if(blocks.some(b=>b.tid===tp.id&&b.day===day))continue;
        if(!v.last||R(v,at)<.75)cands.push({c,tp,v,u:urgency(c,v,at)})}}
    cands.sort((a,b)=>b.u-a.u);
    let lastC=null;
    while(budget>=BLOCK&&cands.length){
      let i=cands.findIndex(x=>x.c.id!==lastC);if(i<0)i=0;
      const x=cands.splice(i,1)[0];lastC=x.c.id;budget-=BLOCK;
      const v={last:x.v.last,S:x.v.S};applyRating(v,x.v.last?1:2,at);if(!x.v.last)v.S=2;sim.set(x.tp.id,v);
      blocks.push({id:uid(),day,kind:"recall",cid:x.c.id,tid:x.tp.id,mins:BLOCK,done:false});
    }
  }
  S.plan={start:today,blocks};save();
}
function cleanPlan(){if(S.plan)S.plan.blocks=S.plan.blocks.filter(b=>S.courses.some(c=>c.id===b.cid)&&(b.kind==="mock"||findTopic(b.tid)))}
const todays=()=>(S.plan?.blocks||[]).filter(b=>b.day===todayISO());

/* ======================= progression ======================= */
const need=n=>60*n*(n-1);
function levelOf(xp){let n=1;while(need(n+1)<=xp)n++;return n}
const titleOf=l=>{const a=sk("titles");return a[Math.min(l-1,a.length-1)]};
const isActive=d=>!!S.log[d]||S.frozen.includes(d);
function streak(){let n=0,d=Date.now();if(!isActive(iso(d)))d-=DAY;while(isActive(iso(d))){n++;d-=DAY}return n}
function useSaves(){
  const y=iso(Date.now()-DAY),y2=iso(Date.now()-2*DAY);
  if(!isActive(y)&&isActive(y2)&&S.saves>0){S.saves--;S.frozen.push(y);S.frozen=S.frozen.slice(-30);save();setTimeout(()=>toast(t("saveUsed")),800)}
}
let pendingLevel=null;
function reward(xp,coins){
  const before=levelOf(S.xp);S.xp+=xp;S.coins+=coins;
  if(levelOf(S.xp)>before)pendingLevel=levelOf(S.xp);
  const d=todayISO();S.log[d]=(S.log[d]||0)+1;
}
const FEATS=[
 ["first",10,()=>S.stats.recalls>=1],["rescue",15,()=>S.stats.rescues>=1],["streak7",40,()=>streak()>=7],["realms3",20,()=>S.courses.length>=3],
 ["trial",25,()=>S.stats.trials>=1],["ward",30,()=>S.courses.some(c=>daysBetween(todayISO(),c.exam)>=0&&forecast(c)>=.7)],
 ["blaze20",40,()=>allTopics().filter(x=>R(x.tp)>=.8).length>=20],["level5",30,()=>levelOf(S.xp)>=5],["bounty",15,()=>S.stats.bounties>=1],["hundred",60,()=>S.stats.recalls>=100]
];
function checkFeats(){
  let delay=600;
  for(const [id,coins,test] of FEATS){if(!S.feats.includes(id)&&test()){S.feats.push(id);S.coins+=coins;const f=t("feats")[id][0];setTimeout(()=>toast(t("featGot",{f,i:coins})),delay);delay+=2600}}
  save();
}
function checkBonus(){
  const bl=todays();if(!bl.length||S.bonus===todayISO())return false;
  if(bl.every(b=>b.done)){S.bonus=todayISO();S.stats.bounties++;S.xp+=40;S.coins+=10;return true}
  return false;
}

function colorOf(k){return k==="orange"&&S.skin==="rich"?"#1F6FB2":COLORS[k]}

  if(k&&AVSVG[k])return `<span class="avatar" style="background:${bg};width:${sz}px;height:${sz}px">${AVSVG[k]}</span>`;

/* ======================= today ======================= */
function taskRow(b){
  const c=S.courses.find(x=>x.id===b.cid);if(!c)return"";
  const f=b.kind==="recall"?findTopic(b.tid):null,col=colVar(c.col);
  const title=b.kind==="mock"?t("tMock"):`${t("tReview")}: ${esc(f.tp.name)}`;
  const meta=b.kind==="mock"?`${esc(c.name)} · ${t("tMockDesc")} · ${b.mins} ${t("min")}`:`${esc(c.name)} · ${b.mins} ${t("min")} · ${t(stat(f.tp))}`;
  const rw=b.kind==="mock"?"+80 XP":(f.tp.last&&R(f.tp)<.5?"≤45 XP":"≤30 XP");
  const act=b.done?`<span class="reward">✓ ${t("doneTag")}</span>`:b.kind==="mock"?`<button class="btn line sm" data-mock="${b.id}">${t("markDone")}</button>`:`<button class="btn sm" data-block="${b.id}">${t("start")}</button>`;
  return `<div class="task${b.done?" done":""}"><span class="ticon" style="color:${col};border-color:${col}">${b.kind==="mock"?"T":c.name.trim()[0].toUpperCase()}</span>
    <div style="min-width:0"><div class="t">${title}</div><div class="m">${meta} · <span class="reward">${rw}</span></div></div>${act}</div>`;
}
function renderToday(){
  const bl=todays(),done=bl.filter(b=>b.done).length;
  $("#w-title").textContent=sk("title");$("#w-sub").textContent=sk("sub");
  $("#tasks").innerHTML=`<div class="head"><h2>${t("tasksTitle")}</h2><span class="muted small">${fmtDay(todayISO(),{weekday:"long",day:"numeric",month:"long"})}</span></div>
    ${bl.length?bl.map(taskRow).join(""):`<div class="empty">${t("tasksEmpty")}</div>`}
    ${bl.length?`<div class="bonus"><span>${S.bonus===todayISO()?"✓ "+t("bonusDone"):t("bonus")}</span><span class="bar"><span style="width:${done/bl.length*100}%"></span></span><span class="reward">+40 XP · +10 ${t("coins")}</span></div>`:""}`;
  const low=allTopics().filter(x=>x.tp.last).map(x=>({...x,r:R(x.tp)})).filter(x=>x.r<.8).sort((a,b)=>a.r-b.r).slice(0,6);
  $("#lowpanel").innerHTML=`<div class="head" style="margin-bottom:4px"><h2>${t("lowTitle")}</h2></div><p class="muted small" style="margin:0 0 10px">${t("lowSub")}</p>
    ${low.length?low.map(x=>`<div class="lowrow"><div style="min-width:0"><div class="w" style="opacity:${(.25+.75*x.r).toFixed(2)}">${esc(x.tp.name)}</div>
      <div class="meter"><span style="width:${pct(x.r)};background:${colVar(x.c.col)}"></span></div></div>
      <span class="pct">${pct(x.r)}</span><button class="btn line sm" data-topic="${x.tp.id}">${t("review")}</button></div>`).join(""):`<div class="empty">—</div>`}`;
  const tps=allTopics();const avg=tps.length?tps.reduce((s,x)=>s+R(x.tp),0)/tps.length:0;
  $("#avg").innerHTML=`${t("avgLabel")}<b>${pct(avg)}</b>`+(S.skin==="rich"?`<span class="nw">${t("netWorth")}<b>${money(S.courses.reduce((a,c)=>a+worth(avgR(c)),0))}</b></span>`:"");
  $("#legend").innerHTML=S.courses.map(c=>{const d=daysBetween(todayISO(),c.exam);
    return `<button data-course="${c.id}"><span class="dot" style="background:${colVar(c.col)}"></span><b>${esc(c.name)}</b><span class="muted">${pct(avgR(c))} ${t("memory")} · ${d<0?t("examPast"):d===0?t("examToday"):t("examIn",{n:d})}</span></button>`}).join("")
    ||`<span class="muted small">${t("noCourses")} <a class="link" href="#courses">${t("newCourse")}</a></span>`;

}

/* ======================= world canvas ======================= */
const W={w:0,h:0,dpr:1,ents:[],col:[],xs:{},parts:[],bld:[],bldW:0};
function worldLayout(){
  const wrap=$("#world"),cv=$("#cv"),w=document.documentElement.clientWidth,vh=Math.max(window.innerHeight,cv.clientHeight||0),dpr=Math.min(2,devicePixelRatio||1);
  const h=Math.round(Math.max(330,Math.min(w<640?760:680,vh*(w<640?.9:.74))));
  W.w=w;W.h=h;W.vh=vh;W.dpr=dpr;cv.width=w*dpr;cv.height=vh*dpr;
  const cs=getComputedStyle(document.documentElement);W.col=[0,1,2,3,4].map(i=>cs.getPropertyValue("--c"+i).trim());W.bgc=cs.getPropertyValue("--bg").trim();
  if(wrap.offsetWidth){const top=wrap.getBoundingClientRect().top+window.scrollY;wrap.style.minHeight=Math.max(260,h-top+8)+"px"}
  W.ents=S.courses.map((c,i)=>({c,i,r:avgR(c)}));
  W.ents.forEach(e=>{if(W.xs[e.c.id]==null)W.xs[e.c.id]=(w*(.08+.31*e.i))%w});
  if(W.bldW<w+120){W.bld=[];let x=0;while(x<w+160){const bw=26+Math.random()*30,bh=26+Math.random()*58;W.bld.push({x,bw,bh,s:Math.floor(Math.random()*997)});x+=bw+5}W.bldW=x}
  if(!W.parts.length)W.parts=[...Array(14)].map(()=>({x:Math.random(),y:Math.random(),v:.0003+Math.random()*.0006,p:Math.random()*6}));
  drawWorld(performance.now());
}
function drawWorld(now){
  S.skin==="rich"?drawRich(now):drawRace(now);
  const c=$("#cv").getContext("2d");c.setTransform(W.dpr,0,0,W.dpr,0,0);
  if(W.vh>W.h){const g=c.createLinearGradient(0,W.h,0,W.vh);const a=S.skin==="rich"?["#173B5C","#0C2238"]:["#121317","#0B0C0F"];g.addColorStop(0,a[0]);g.addColorStop(1,a[1]);c.fillStyle=g;c.fillRect(0,W.h,W.w,W.vh-W.h)}

  if(!pendingLevel)return;const l=pendingLevel;pendingLevel=null;$("#pop").hidden=false;
  $("#pop").innerHTML=`<div class="sheet lvlup" role="dialog" aria-modal="true" aria-label="${t("levelUp")}"><div class="label">${t("levelUp")}</div><div class="n">${l}</div>
    <div class="muted">${t("levelNow")}</div><h3 style="font-size:1.8rem;color:var(--accent)">${esc(titleOf(l))}</h3><div><button class="btn" id="pop-ok">${t("onward")}</button></div></div>`;
  $("#pop-ok").onclick=()=>{$("#pop").hidden=true;$("#pop").innerHTML=""};$("#pop-ok").focus();
}

/* ======================= tutorial ======================= */
let TUT=null;
function openTut(){TUT=0;$("#tut").hidden=false;drawTut()}
function closeTut(view){
  TUT=null;$("#tut").hidden=true;$("#tut").innerHTML="";store(KEY+"-tut","1");setTimeout(()=>Ads.init(),600);
  document.querySelectorAll(".tut-focus").forEach(x=>x.classList.remove("tut-focus"));
  location.hash="#"+(view||"today");renderAll();
}
function drawTut(){
  const steps=t("tutSteps"),s=steps[TUT],last=TUT===steps.length-1;
  if(location.hash.slice(1)!==s.v)location.hash="#"+s.v;
  document.querySelectorAll(".tut-focus").forEach(x=>x.classList.remove("tut-focus"));
  if(s.focus){const a=document.querySelector(`nav.tabs a[data-v="${s.focus}"]`);if(a)a.classList.add("tut-focus")}
  let demo="";
  if(s.demo==="live")demo=`<div class="demo"><span class="w live">${esc(s.w)}</span></div>`;
  if(s.demo==="scale")demo=`<div class="demo">${s.ws.map((w,i)=>`<span><span class="w" style="opacity:${[1,.45,.6][i]};${i===2?"text-decoration:underline dashed;text-underline-offset:5px;text-decoration-thickness:1px":""}">${esc(w)}</span><span class="r">${esc(s.ls[i])}</span></span>`).join("")}</div>`;
  if(s.skins)demo=skinCards();
  if(s.name)demo=`<input type="text" id="tut-name" maxlength="28" value="${esc(S.name)}" placeholder="${esc(t("namePh"))}" aria-label="${esc(t("nameLabel"))}">`+avPicker();
  $("#tut").innerHTML=`<div class="sheet float" role="dialog" aria-modal="true" aria-labelledby="tut-h">
    <div class="foot"><div class="dots" aria-label="${TUT+1} / ${steps.length}">${steps.map((_,i)=>`<i class="${i===TUT?"on":""}"></i>`).join("")}</div>
      <div class="seg" role="group" aria-label="Language"><button data-lang="en" aria-pressed="${LANG==="en"}">EN</button><button data-lang="nl" aria-pressed="${LANG==="nl"}">NL</button></div></div>
    <h3 id="tut-h" style="font-size:clamp(1.7rem,5vw,2.2rem)">${esc(s.h)}</h3><p class="muted" style="margin:0;font-size:1.02rem">${esc(s.p)}</p>${demo}
    <div class="foot">
      ${TUT===0?`<button class="link" id="tut-skip" style="color:var(--muted)">${t("tutSkip")}</button>`:`<button class="btn ghost sm" id="tut-back">${t("tutBack")}</button>`}
      ${last?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn line sm" id="tut-explore">${t("tutExplore")}</button><button class="btn sm" id="tut-own">${t("tutOwn")}</button></div>`
           :`<button class="btn sm" id="tut-next">${t("tutNext")} · ${TUT+1}/${steps.length}</button>`}</div></div>`;
  const b=id=>$("#"+id),nm=b("tut-name");
  if(nm){nm.oninput=e=>{S.name=e.target.value.trim();save();renderMe()};nm.focus()}
  if(b("tut-skip"))b("tut-skip").onclick=()=>closeTut();
  if(b("tut-back"))b("tut-back").onclick=()=>{TUT--;drawTut()};
  if(b("tut-next")){b("tut-next").onclick=()=>{TUT++;drawTut()};if(!nm)b("tut-next").focus()}
  if(b("tut-explore"))b("tut-explore").onclick=()=>closeTut("today");
  if(b("tut-own"))b("tut-own").onclick=()=>{S.courses=S.courses.filter(c=>!c.ex);plan();closeTut("courses");setTimeout(()=>{const n=$("#c-name");if(n)n.focus()},60)};
}

/* ======================= advertenties ======================= */
// Alleen beloonde video's waar de gebruiker zelf voor kiest. Geen banners, geen onderbrekingen.
// Volgorde (verplicht in Europa): 1. Google-toestemming (UMP)  2. Apple-volgvraag (ATT)  3. reclame starten.
const Ads={
  // Google-TEST-ID. Vervang door je eigen AdMob rewarded-ID vóór publicatie (zie docs/APP-STORE-STAPPEN.md).
  rewardedId:"ca-app-pub-3940256099942544/1712485313",
  started:false,ready:false,privacyRequired:false,
  async init(){
    if(this.started||!IS_APP||!NP().AdMob)return;this.started=true;const A=NP().AdMob;
    try{let info=await A.requestConsentInfo();
      if(info.isConsentFormAvailable&&info.status==="REQUIRED")info=await A.showConsentForm();
      this.privacyRequired=info.privacyOptionsRequirementStatus==="REQUIRED";
      if(info.canRequestAds===false)return;}catch(e){console.warn("Toestemming niet beschikbaar",e)}
    try{const st=await A.trackingAuthorizationStatus();if(st&&st.status==="notDetermined")await A.requestTrackingAuthorization()}catch(e){}
    try{await A.initialize({maxAdContentRating:"ParentalGuidance"});this.ready=true}catch(e){console.warn("Reclame niet beschikbaar",e)}
  },
  async rewarded(){
    if(!IS_APP)return mockAd();
    if(!this.ready){await this.init();if(!this.ready)return false}
    const A=NP().AdMob;
    try{await A.prepareRewardVideoAd({adId:this.rewardedId});const r=await A.showRewardVideoAd();return !!r}catch(e){return false}
  },
  async privacy(){try{await NP().AdMob.showPrivacyOptionsForm()}catch(e){}}
};
// In de browser: nagespeelde advertentie van 3 seconden (testmodus).
function mockAd(){return new Promise(res=>{let n=3;const p=$("#pop");p.hidden=false;
  const draw=()=>{p.innerHTML=`<div class="sheet lvlup" role="dialog" aria-modal="true"><div class="label">${t("testAd")}</div><div class="n">${n}</div></div>`};draw();
  const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);p.hidden=true;p.innerHTML="";res(true)}else draw()},1000)})}
async function watchAd(kind){
  const a=adDay();if(kind==="coins"&&a.coins>=5||kind==="save"&&a.save>=1)return;
  const ok=await Ads.rewarded();
  if(!ok){toast(t("adFail"));return}
  const d=adDay();if(kind==="coins"){d.coins++;S.coins+=15}else{d.save++;S.saves++}
  haptic(true);save();renderAll();toast(t("adThanks"));
}

/* ======================= events ======================= */
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2500)}
document.addEventListener("click",e=>{
  const el=e.target.closest("button,a");if(!el)return;const ds=el.dataset;
  if(ds.lang){LANG=ds.lang;store(KEY+"-lang",LANG);renderAll();if(RC)drawRecall();if(TUT!=null)drawTut();return}
  if(ds.av){S.av=ds.av;save();renderAll();if(TUT!=null)drawTut();return}
  if(ds.skin){S.skin=ds.skin;save();renderAll();if(TUT!=null)drawTut();return}
  if(ds.block){const b=S.plan.blocks.find(x=>x.id===ds.block);if(b)openRecall(b.tid,b.id);return}
  if(ds.topic){openRecall(ds.topic,null);return}
  if(ds.mock){const b=S.plan.blocks.find(x=>x.id===ds.mock);if(b&&!b.done){b.done=true;reward(80,20);S.stats.trials++;
    const bo=checkBonus();save();checkFeats();renderAll();toast(`+80 XP · +20 ${t("coins")}${bo?" · "+t("bonusDone"):""}`);showLevelUp()}return}
  if(ds.course){editId=null;location.hash="#courses";setTimeout(()=>{const r=$("#r-"+ds.course);if(r)r.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"})},60);return}
  if(ds.del){if(delArm!==ds.del){delArm=ds.del;renderCourses();return}
    S.courses=S.courses.filter(c=>c.id!==ds.del);delArm=null;plan();renderAll();toast(t("courseDeleted"));return}
  if(ds.cancelDel){delArm=null;renderCourses();return}
  if(ds.edit){editId=ds.edit;delArm=null;renderCourses();const n=$("#e-name-"+editId);if(n)n.focus();return}
  if(ds.cancelEdit){editId=null;renderCourses();return}
  if(ds.ad){watchAd(ds.ad);return}
  if(el.dataset.adprivacy){Ads.privacy();return}
  if(ds.buy){const price=ds.buy==="save"?60:40;if(S.coins<price){toast(t("notEnough"));return}
    S.coins-=price;if(ds.buy==="save")S.saves++;else{S.owned.push(ds.buy);S.color=ds.buy}save();renderAll();toast(t("bought"));return}
  if(ds.equip){S.color=ds.equip;save();renderAll();return}
  if(el.id==="clearEx"){S.courses=S.courses.filter(c=>!c.ex);plan();renderAll();return}
  if(el.id==="replan"){plan();renderAll();toast(t("replanned"));return}
  if(el.id==="tut-open"){openTut();return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  const lines=s=>[...new Set(s.split(/\n+/).map(x=>x.trim()).filter(Boolean))].slice(0,60);
  const fresh=n=>({id:uid(),name:n,last:null,S:1,n:0});
  if(f.id==="cform"){
    const name=$("#c-name").value.trim(),date=$("#c-date").value;if(!name||!date)return;
    const used=new Set(S.courses.map(c=>c.col));let col=0;while(used.has(col)&&col<COLS)col++;
    S.courses.push({id:uid(),name,exam:date,col:col%COLS,topics:lines($("#c-topics").value).map(fresh)});
    plan();checkFeats();renderAll();toast(t("courseAdded"));
  }else if(f.classList.contains("editc")){
    const c=S.courses.find(x=>x.id===f.dataset.cid);if(!c)return;
    const name=$("#e-name-"+c.id).value.trim(),date=$("#e-date-"+c.id).value;if(!name||!date)return;
    const old=new Map(c.topics.map(x=>[x.name.toLowerCase(),x]));
    c.name=name;c.exam=date;c.topics=lines($("#e-topics-"+c.id).value).map(n=>old.get(n.toLowerCase())||fresh(n));
    editId=null;plan();renderAll();toast(t("courseSaved"));
  }else if(f.classList.contains("addtp")){
    const c=S.courses.find(x=>x.id===f.dataset.cid),nw=lines(f.querySelector("textarea").value);if(!c||!nw.length)return;
    const have=new Set(c.topics.map(x=>x.name.toLowerCase()));c.topics.push(...nw.filter(n=>!have.has(n.toLowerCase())).map(fresh));
    plan();renderAll();toast(t("topicsAdded"));
  }
});
document.addEventListener("change",e=>{
  const d=e.target.dataset.dow;if(d!=null){S.hours[+d]=+e.target.value;plan();renderAll();return}
  if(e.target.id==="p-name"){S.name=e.target.value.trim();save();renderMe();renderProfile()}
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#pop").hidden){$("#pop").hidden=true;return}if(RC)closeRecall();else if(TUT!=null)closeTut()});

(async()=>{
  await nativeLoad();
  if(IS_APP){const a=document.querySelector("nav.tabs a.pro");if(a)a.hidden=true}
  boot();renderLogo();renderAll();route();
  if(reduceMotion)drawWorld(0);else requestAnimationFrame(loop);
  if(!read(KEY+"-tut"))openTut();else setTimeout(()=>Ads.init(),800);
  if(IS_APP&&NP().SplashScreen)NP().SplashScreen.hide().catch(()=>{});
})();
</script>
